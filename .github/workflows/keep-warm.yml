name: keep-warm

# Pings the Render free-tier backend so it doesn't spin down. A cold instance takes ~50s to
# wake, which makes the app feel broken to testers. This is best-effort: GitHub's scheduled
# cron can be delayed a few minutes, and only runs from the DEFAULT branch (merge to main to
# activate). For guaranteed warmth, upgrade the Render instance (paid) instead.

on:
  schedule:
    - cron: "*/10 * * * *"   # every ~10 minutes (Render spins down after ~15 min idle)
  workflow_dispatch: {}       # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm the backend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://itcabs.onrender.com/docs || echo "000")
          echo "warm ping -> HTTP $code"
          # Never fail the workflow on a transient miss — this is best-effort keep-warm.
